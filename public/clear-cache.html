<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updating JDCA App...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .loader {
      border: 4px solid #E2E8F0;
      border-top: 4px solid #2457D6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Updating JDCA App...</h2>
  <p>Clearing old cached files to ensure you get the latest version.</p>

  <script>
    async function clearAllCaches() {
      try {
        // 1. Unregister all service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
            console.log('ServiceWorker unregistered');
          }
        }

        // 2. Delete all Cache Storage (used by Workbox / PWA)
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (const cacheName of cacheNames) {
            await caches.delete(cacheName);
            console.log('Cache deleted:', cacheName);
          }
        }

        // 3. Clear storage (optional, you can remove these if you want to keep user login state)
        // localStorage.clear();
        // sessionStorage.clear();

        console.log('All caches cleared successfully.');
        
        // 4. Redirect back to the app with a cache-busting query parameter
        setTimeout(() => {
          window.location.replace('/?v=' + new Date().getTime());
        }, 1500);

      } catch (err) {
        console.error('Error clearing caches:', err);
        // Fallback redirect
        window.location.replace('/');
      }
    }

    // Execute immediately
    clearAllCaches();
  </script>
</body>
</html>
